<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Paper RCON Link</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" />
<style>
  :root {
    --bg: #07110c;
    --panel: #102117;
    --panel-2: #0c1a12;
    --line: #1f6b45;
    --emerald: #3dff9a;
    --gold: #e3c56a;
    --redstone: #ff5d4a;
    --text: #d7ffe8;
    --muted: #8fbfa4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Share Tech Mono", ui-monospace, monospace;
    background:
      linear-gradient(rgba(7, 17, 12, .82), rgba(7, 17, 12, .94)),
      repeating-linear-gradient(0deg, transparent, transparent 22px, rgba(61, 255, 154, .05) 23px),
      repeating-linear-gradient(90deg, transparent, transparent 22px, rgba(61, 255, 154, .05) 23px),
      #07110c;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  }
  main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; position: relative; }
  header { display: flex; justify-content: space-between; gap: 16px; align-items: end; }
  h1 { margin: 0; font-family: VT323, monospace; font-size: 54px; letter-spacing: 1px; color: var(--emerald); text-shadow: 0 0 16px rgba(61,255,154,.35); }
  .tag { color: var(--gold); letter-spacing: 2px; font-size: 14px; }
  .layout { display: grid; grid-template-columns: 1.2fr .8fr; gap: 14px; margin-top: 18px; }
  section {
    background: linear-gradient(180deg, rgba(16,33,23,.96), rgba(8,18,13,.96));
    border: 2px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(61,255,154,.18), 0 0 24px rgba(61,255,154,.08);
    padding: 16px;
  }
  h2 { margin: 0 0 12px; font-size: 16px; color: var(--gold); letter-spacing: 1px; }
  label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
  input, select {
    width: 100%;
    background: #07140d;
    color: var(--text);
    border: 1px solid var(--line);
    padding: 10px;
    font: inherit;
  }
  input:focus, select:focus { outline: 1px solid var(--emerald); }
  .grid { display: grid; grid-template-columns: 1.4fr .6fr; gap: 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  button {
    border: 1px solid var(--emerald);
    background: #123524;
    color: var(--emerald);
    font: inherit;
    padding: 9px 12px;
    cursor: pointer;
    text-transform: uppercase;
  }
  button:hover { background: #1b4d33; }
  button.warn { border-color: var(--redstone); color: var(--redstone); background: #2a1412; }
  .presets { display: flex; flex-direction: column; gap: 8px; }
  .preset {
    display: flex; justify-content: space-between; gap: 8px; align-items: center;
    border: 1px solid var(--line); padding: 8px; background: var(--panel-2);
  }
  .preset b { color: var(--emerald); }
  .preset span { color: var(--muted); font-size: 13px; }
  .log { min-height: 180px; white-space: pre-wrap; color: var(--muted); }
  .item { border-top: 1px solid rgba(61,255,154,.18); padding-top: 8px; margin-top: 8px; }
  .item b { color: var(--gold); }
  .note { color: var(--muted); font-size: 13px; line-height: 1.45; }
  @media (max-width: 800px) { .layout, .grid { grid-template-columns: 1fr; } h1 { font-size: 40px; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <div class="tag">LINK // PLAYIT TCP // PAPER</div>
      <h1>RCON TERMINAL</h1>
    </div>
    <div class="tag">STATUS: LOCAL PRESETS</div>
  </header>
  <div class="layout">
    <section>
      <h2>SERVER LINK</h2>
      <label for="name">Preset name</label>
      <input id="name" placeholder="Home Paper" />
      <div class="grid">
        <div>
          <label for="ip">IP</label>
          <input id="ip" placeholder="name.gl.at.ply.gg" autocomplete="off" />
        </div>
        <div>
          <label for="port">RCON port</label>
          <input id="port" value="25575" inputmode="numeric" />
        </div>
      </div>
      <label for="password">RCON password</label>
      <input id="password" type="password" placeholder="From server.properties" />
      <label><input id="savePassword" type="checkbox" style="width:auto" /> Save password with this preset on this browser</label>
      <div class="row">
        <button id="save" type="button">Save server preset</button>
        <button id="clear" class="warn" type="button">Clear fields</button>
      </div>
      <label for="command">Command</label>
      <input id="command" placeholder="list" />
      <div class="row">
        <button id="send" type="button">Send</button>
        <button type="button" data-cmd="list">list</button>
        <button type="button" data-cmd="save-all">save-all</button>
        <button type="button" data-cmd="time query daytime">time</button>
      </div>
      <p id="status" class="note"></p>
      <div id="log" class="log">No commands yet.</div>
    </section>
    <section>
      <h2>SAVED PRESETS</h2>
      <div id="presets" class="presets"></div>
      <p class="note">Presets stay in this browser only. Use the Playit TCP address in the IP box and the port Playit shows. The tunnel should point at 127.0.0.1 and your RCON port.</p>
    </section>
  </div>
</main>
<script>
const fields = {
  name: document.getElementById('name'),
  ip: document.getElementById('ip'),
  port: document.getElementById('port'),
  password: document.getElementById('password'),
  savePassword: document.getElementById('savePassword'),
  command: document.getElementById('command')
};
const presetsEl = document.getElementById('presets');
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const history = [];
const KEY = 'paper-rcon-presets';

function loadPresets() {
  try { return JSON.parse(localStorage.getItem(KEY) || '[]'); }
  catch { return []; }
}
function storePresets(items) { localStorage.setItem(KEY, JSON.stringify(items)); }
function drawPresets() {
  const items = loadPresets();
  presetsEl.innerHTML = items.length ? '' : '<div class="note">No presets saved yet.</div>';
  for (const item of items) {
    const row = document.createElement('div');
    row.className = 'preset';
    row.innerHTML = `<div><b></b><br><span></span></div>`;
    row.querySelector('b').textContent = item.name;
    row.querySelector('span').textContent = item.ip + ':' + item.port;
    const actions = document.createElement('div');
    const load = document.createElement('button');
    load.textContent = 'Load';
    load.onclick = () => {
      fields.name.value = item.name;
      fields.ip.value = item.ip;
      fields.port.value = item.port;
      fields.password.value = item.password || '';
      statusEl.textContent = 'Loaded ' + item.name;
    };
    const remove = document.createElement('button');
    remove.textContent = 'Delete';
    remove.className = 'warn';
    remove.onclick = () => {
      storePresets(loadPresets().filter(entry => entry.id !== item.id));
      drawPresets();
    };
    actions.append(load, remove);
    row.append(actions);
    presetsEl.append(row);
  }
}
document.getElementById('save').onclick = () => {
  const name = fields.name.value.trim() || fields.ip.value.trim();
  const ip = fields.ip.value.trim();
  const port = fields.port.value.trim();
  if (!ip || !port) { statusEl.textContent = 'Add an IP and RCON port first.'; return; }
  const items = loadPresets().filter(entry => entry.name !== name);
  items.unshift({
    id: Date.now().toString(),
    name,
    ip,
    port,
    password: fields.savePassword.checked ? fields.password.value : ''
  });
  storePresets(items.slice(0, 12));
  drawPresets();
  statusEl.textContent = 'Preset saved on this browser.';
};
document.getElementById('clear').onclick = () => {
  fields.name.value = '';
  fields.ip.value = '';
  fields.port.value = '25575';
  fields.password.value = '';
};
function drawLog() {
  logEl.innerHTML = history.length ? '' : 'No commands yet.';
  for (const item of history) {
    const block = document.createElement('div');
    block.className = 'item';
    block.innerHTML = '<b></b><br><span></span>';
    block.querySelector('b').textContent = '> ' + item.command;
    block.querySelector('span').textContent = item.output;
    logEl.append(block);
  }
}
async function send(text) {
  const command = (text || fields.command.value).trim();
  if (!command) return;
  statusEl.textContent = 'Sending...';
  try {
    const res = await fetch('/rcon', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        ip: fields.ip.value.trim(),
        port: Number(fields.port.value),
        password: fields.password.value,
        command
      })
    });
    const data = await res.json();
    history.unshift({command, output: data.output || data.message || 'No output'});
    statusEl.textContent = res.ok ? 'Sent' : 'Could not send';
  } catch {
    history.unshift({command, output: 'Netlify can store this page, but a browser cannot open the Playit TCP tunnel by itself.'});
    statusEl.textContent = 'Page is live. TCP send is blocked by the browser.';
  }
  history.splice(20);
  fields.command.value = '';
  drawLog();
}
document.getElementById('send').onclick = () => send();
fields.command.addEventListener('keydown', (event) => { if (event.key === 'Enter') send(); });
for (const button of document.querySelectorAll('[data-cmd]')) button.onclick = () => send(button.dataset.cmd);
drawPresets();
</script>
</body>
</html>
